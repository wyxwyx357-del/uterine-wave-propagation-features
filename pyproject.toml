[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uterine-wave-propagation-features"
version = "0.1.0"
description = "Anatomical sampling, segmented CUDA tracking and uterine wave-pattern research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
uterine-wave = "uterine_wave.cli:main"

[tool.setuptools.packages.find]
include = ["uterine_wave*"]

