name: Frozen analysis synthetic tests
on:
  pull_request:
  push:
    branches: [mse-classification-freeze]
permissions:
  contents: read
jobs:
  synthetic-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r analysis/requirements.txt
      - run: python -m unittest discover -s analysis/tests -v
  tiny-mlp-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r analysis/requirements.txt
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m analysis.pregnancy_prediction.code.tiny_mlp_models
