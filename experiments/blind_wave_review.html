<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原视频候选复核</title>
<style>
body{font:17px/1.65 system-ui,sans-serif;background:#f4f6f8;color:#182432;margin:20px auto;padding:0 20px;max-width:1250px}main{background:white;padding:20px;border-radius:10px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select,input,textarea{font:inherit;padding:6px}button{cursor:pointer}label{display:inline-flex;align-items:center;gap:6px}.viewport{position:relative;overflow:hidden;background:#111;width:100%;min-height:150px}.stage{position:absolute}.stage video{display:block;width:100%}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.seek{width:100%}textarea{box-sizing:border-box;width:100%;height:70px}.notice{background:#fff4d9;padding:12px}#status{font-weight:600}#error{color:#a00}#classification{width:100%;padding:10px}#group{width:140px}#markStart,#markEnd{width:100px}.muted{color:#55616e}
</style>
<main><h1>原视频候选复核</h1>
<p>先看原视频，再选择四类之一。看不清就选“不确定”。此页隐藏强度、热图和程序方向；标出的位置与时段来自程序，不代表已经确认有波。</p>
<div class="notice">保持原生时间轴、1倍速。默认显示双壁及周围区域，可切换全景；白色点对只标位置，不表示传播方向。“未见可信活动”不等于证明没有弱活动。</div>
<div class="controls"><button id="prev">上一项</button><select id="candidate" aria-label="候选"></select><button id="next">下一项</button><span id="status"></span></div>
<p id="title"></p><p id="error"></p>
<div class="viewport"><div class="stage"><video controls preload="metadata"></video><canvas></canvas></div></div>
<input class="seek" type="range" min="0" step="0.01" value="0" aria-label="原视频时间">
<div class="controls"><button id="play">播放/暂停</button><button id="window">重看待核对时段</button><button id="whole">从全片开头看</button><button id="zoom">全景 / 局部</button><label><input id="points" type="checkbox">显示待核对点对</label><span id="clock"></span></div>
<p class="muted">播放不会在候选边界停止。看完周围时段，也可看全片，检查是否属于同一次活动。</p>
<select id="classification" aria-label="人工分类">
<option value="unreviewed">尚未复核</option><option value="definite_propagation">明确传播：可见活动依次经过不同位置</option><option value="definite_local_activity">明确局部活动：可见变化，但看不出依次传播</option><option value="no_credible_visible_activity">未见可信活动：当前原视频中未能确认</option><option value="uncertain">不确定：无法可靠判断</option></select>
<div class="controls"><label>同次活动组（可选）<input id="group" placeholder="例如 a"></label><span class="muted">同一病例内共用组名，帮助识别跨壁/相位重复。</span></div>
<div class="controls"><button id="start">记当前为开始</button><input id="markStart" type="number" min="0" step="0.01" aria-label="人工开始秒"><button id="end">记当前为结束</button><input id="markEnd" type="number" min="0" step="0.01" aria-label="人工结束秒"><span>人工边界可留空，不要求逐帧标注。</span></div>
<textarea id="notes" placeholder="备注（可选）" aria-label="备注"></textarea>
<div class="controls"><button id="export">导出人工标签 JSON</button><button id="csv">导出标签 CSV</button><span id="saved"></span></div>
<p class="muted">修改自动暂存在本机浏览器中，请同时导出备份。未复核和不确定不会计为零活动。本页不计算正式波次数。</p></main>
<script src="review_data.js"></script>
<script>
const bundle=window.blindReview,$=id=>document.getElementById(id),v=document.querySelector('video'),view=document.querySelector('.viewport'),stage=document.querySelector('.stage'),canvas=document.querySelector('canvas');
let index=0,currentCase=null,data=null,roi=true,loadSerial=0,answers={},storageOK=true;
const loading={};
const storageKey='wave-review-'+bundle.bundle_id, fields=['classification','group','markStart','markEnd','notes'];
try{answers=JSON.parse(localStorage.getItem(storageKey)||'{}');}catch(e){storageOK=false;$('error').textContent='浏览器暂存不可用，请及时导出标签。';}
bundle.items.forEach((x,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=x.token+' · '+x.case_alias;$('candidate').append(opt);});
function item(){return bundle.items[index];}
function updateStatus(){const count=Object.values(answers).filter(x=>x.classification!=='unreviewed').length;$('status').textContent='已复核 '+count+' / '+bundle.items.length;}
function save(){const a={};fields.forEach(k=>a[k]=$(k).value);a.updated_at=new Date().toISOString();answers[item().token]=a;if(storageOK){try{localStorage.setItem(storageKey,JSON.stringify(answers));$('saved').textContent='已暂存';}catch(e){storageOK=false;$('error').textContent='暂存失败，请立即导出标签。';}}updateStatus();}
fields.forEach(k=>$(k).addEventListener('input',save));
function layout(){if(!data||!v.videoWidth)return;const box=roi?data.roi:[0,data.width,0,data.height],scale=view.clientWidth/(box[1]-box[0]);view.style.height=(box[3]-box[2])*scale+'px';stage.style.width=data.width*scale+'px';stage.style.left=-box[0]*scale+'px';stage.style.top=-box[2]*scale+'px';canvas.width=data.width;canvas.height=data.height;stage.style.visibility='visible';draw();}
function nearestFrame(t){let lo=0,hi=data.time_s.length-1;while(lo<hi){const mid=Math.floor((lo+hi)/2);if(data.time_s[mid]<t)lo=mid+1;else hi=mid;}if(lo>0&&t-data.time_s[lo-1]<data.time_s[lo]-t)return lo-1;return lo;}
function draw(){if(!data)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);if($('points').checked){const frame=data.frames[nearestFrame(v.currentTime)];ctx.strokeStyle='rgba(255,255,255,.85)';ctx.fillStyle='white';ctx.lineWidth=1.5;for(const section of item().sections){const ids=data.pair_ids[item().wall][section],a=frame[ids[0]],b=frame[ids[1]];if(a&&b){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();}for(const p of [a,b])if(p){ctx.beginPath();ctx.arc(...p,2.8,0,2*Math.PI);ctx.fill();}}}$('clock').textContent=v.currentTime.toFixed(2)+' / '+bundle.cases[item().case_alias].duration_s.toFixed(2)+' 秒';document.querySelector('.seek').value=v.currentTime;}
function seekWindow(){v.pause();v.currentTime=Math.max(0,item().start_s-2);draw();}
async function select(i){index=Math.max(0,Math.min(bundle.items.length-1,i));const x=item();$('candidate').value=index;$('title').textContent=x.token+' · '+x.case_alias+' · '+(x.wall===0?'前壁':'后壁')+' · 待核对 '+x.start_s.toFixed(1)+'–'+x.end_s.toFixed(1)+' 秒（播放从提前2秒开始，可继续看全片）';const a=answers[x.token]||{};fields.forEach(k=>$(k).value=a[k]||(k==='classification'?'unreviewed':''));$('saved').textContent='';v.pause();const serial=++loadSerial;if(currentCase!==x.case_alias){currentCase=null;data=null;stage.style.visibility='hidden';const meta=bundle.cases[x.case_alias];if(!loading[x.case_alias])loading[x.case_alias]=new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src=meta.data;tag.onload=()=>{tag.remove();resolve();};tag.onerror=()=>reject(Error('轨迹显示文件未加载'));document.head.append(tag);});await loading[x.case_alias];if(serial!==loadSerial)return;data=window.blindFrameData[x.case_alias];currentCase=x.case_alias;v.poster=meta.poster;v.src=meta.video;document.querySelector('.seek').max=meta.duration_s;v.load();}else seekWindow();updateStatus();}
function navigate(i){select(i).catch(e=>$('error').textContent=e.message);}
$('candidate').onchange=()=>navigate(Number($('candidate').value));$('prev').onclick=()=>navigate(index-1);$('next').onclick=()=>navigate(index+1);$('play').onclick=()=>{if(v.paused)v.play();else v.pause();};$('window').onclick=()=>{seekWindow();v.play();};$('whole').onclick=()=>{v.currentTime=0;v.play();};$('zoom').onclick=()=>{roi=!roi;layout();};$('points').onchange=draw;
document.querySelector('.seek').oninput=e=>v.currentTime=Number(e.target.value);v.addEventListener('loadedmetadata',()=>{v.playbackRate=1;layout();seekWindow();});v.addEventListener('seeked',draw);v.addEventListener('timeupdate',draw);v.addEventListener('error',()=>{$('error').textContent='视频未加载，请保持整个文件夹结构，并用Edge或Chrome打开本页。';});new ResizeObserver(layout).observe(view);
if(v.requestVideoFrameCallback){const tick=()=>{draw();v.requestVideoFrameCallback(tick);};v.requestVideoFrameCallback(tick);}
$('start').onclick=()=>{$('markStart').value=v.currentTime.toFixed(2);save();};$('end').onclick=()=>{$('markEnd').value=v.currentTime.toFixed(2);save();};
function rows(){return bundle.items.map(x=>({token:x.token,case_alias:x.case_alias,...(answers[x.token]||{classification:'unreviewed',group:'',markStart:'',markEnd:'',notes:''})}));}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=()=>download(JSON.stringify({bundle_id:bundle.bundle_id,exported_at:new Date().toISOString(),labels:rows()},null,2),'wave_review_labels.json','application/json');
$('csv').onclick=()=>{const keys=['token','case_alias','classification','group','markStart','markEnd','notes'],escape=x=>'"'+String(x??'').replaceAll('"','""')+'"';download('\ufeff'+[keys,...rows().map(r=>keys.map(k=>r[k]))].map(r=>r.map(escape).join(',')).join('\r\n'),'wave_review_labels.csv','text/csv;charset=utf-8');};
if(bundle.items.length)navigate(0);else $('error').textContent='没有待复核候选。';
</script></html>
